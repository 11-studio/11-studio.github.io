<!-- Marchio Ferragatti: stesso disegno di FERRAGATTI.svg, tagliato al
     vivo. L'originale e' un foglio A4 e il segno ne occupa un sesto, che
     dentro una barra alta 50px vorrebbe dire un marchio illeggibile. Qui
     il viewBox e' il riquadro del segno e basta.

     Il colore non e' scritto: fill="currentColor" lo fa ereditare da chi
     lo usa. Serve perche' la barra cambia tono scendendo (il token del
     testo passa da bianco a nero) e un blu fisso resterebbe fermo su uno
     dei due. -->
